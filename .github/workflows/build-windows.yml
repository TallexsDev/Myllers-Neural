name: Build Myllers Neural Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Compilar EXE
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name MyllersNeural
          --add-data "data/knowledge.json;data"
          --runtime-hook build/runtime_hook.py
          chat.py

      - name: Publicar executável
        uses: actions/upload-artifact@v4
        with:
          name: MyllersNeural-Windows
          path: dist/MyllersNeural.exe
